name: Bug report
description: Something in alia does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `alia doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log (`alia logs`, last ~50 lines)
      render: text
