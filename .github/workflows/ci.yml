name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install coverage
        run: python -m pip install --upgrade pip coverage
      - name: Unit tests
        run: python -m coverage run --source=. --omit='tests/*,bench/*,tools/*' -m unittest discover -s tests -v
      - name: Coverage report
        run: |
          python -m coverage report -m
          python -m coverage xml
      - name: Upload to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # evolution_data.py --check verifies frozen and agent commits in the history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check --output-format=github alia bench tools tests sitetests
      - name: Evolution data is current
        run: python tools/evolution_data.py --check
      - name: Shellcheck
        run: shellcheck install.sh tools/*.sh bench/*.sh
      - name: Validate JSON
        run: |
          for f in profiles.json i18n/*.json branding/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
          for f in bench/results/*.jsonl; do
            python -c 'import json,sys; [json.loads(l) for l in open(sys.argv[1]) if l.strip()]' "$f" \
              || { echo "::error file=$f::invalid JSONL"; exit 1; }
          done
      - name: No personal data
        run: |
          if grep -rIn --exclude-dir=.git -e '/home/[a-z]' -e '@gmail\.com' .; then
            echo "::error::personal path or e-mail found"; exit 1
          fi
      - name: i18n keys match
        run: |
          python - <<'PY'
          import json
          en, de = (set(json.load(open(f"i18n/{l}.json"))) for l in ("en", "de"))
          missing = sorted(en ^ de)
          if missing:
              raise SystemExit(f"i18n key mismatch: {missing}")
          print(f"{len(en)} keys, EN == DE")
          PY

  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # --rerun-acceptance needs Alia's commits
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Check site
        env:
          SITE_TESTS_REQUIRE_BROWSER: "1"
        run: |
          python -m sitetests --strict --out site-report
          python -m unittest tests.test_evolution_page -v
          python tools/evolution_data.py --rerun-acceptance
      - name: Upload site report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-report
          path: site-report

  evolution-path-guard:
    name: Self-evolution path guard
    # Runs on every pull request (no job-level skip), so as a required check it always reports a real result.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Run the guard as it is on the base branch, so a PR cannot weaken it. Only the PR that introduces
          # the guard (evolution/round-0) may fall back to its own copy; any other PR fails without it.
          if ! git show "origin/$BASE_REF:tools/evolution_guard.py" > "$RUNNER_TEMP/guard.py" 2>/dev/null; then
            if [ "$HEAD_REF" != "evolution/round-0" ]; then
              echo "::error::base branch has no tools/evolution_guard.py"; exit 1
            fi
            cp tools/evolution_guard.py "$RUNNER_TEMP/guard.py"
          fi
          git log --format=%B "origin/$BASE_REF..HEAD" > "$RUNNER_TEMP/messages.txt"
          git diff -z --no-renames --name-only "origin/$BASE_REF...HEAD" \
            | python3 "$RUNNER_TEMP/guard.py" --branch "$HEAD_REF" --messages "$RUNNER_TEMP/messages.txt"
      - name: Failed rounds stay failed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/evolution_data.py --check --base "origin/$BASE_REF"
