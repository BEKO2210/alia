name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install coverage
        run: python -m pip install --upgrade pip coverage
      - name: Unit tests
        run: python -m coverage run --source=. --omit='tests/*,bench/*,tools/*' -m unittest discover -s tests -v
      - name: Coverage report
        run: |
          python -m coverage report -m
          python -m coverage xml
      - name: Upload to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check --output-format=github alia bench tools tests
      - name: Shellcheck
        run: shellcheck install.sh tools/*.sh bench/*.sh
      - name: Validate JSON
        run: |
          for f in profiles.json i18n/*.json branding/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
          for f in bench/results/*.jsonl; do
            python -c 'import json,sys; [json.loads(l) for l in open(sys.argv[1]) if l.strip()]' "$f" \
              || { echo "::error file=$f::invalid JSONL"; exit 1; }
          done
      - name: No personal data
        run: |
          if grep -rIn --exclude-dir=.git -e '/home/[a-z]' -e '@gmail\.com' .; then
            echo "::error::personal path or e-mail found"; exit 1
          fi
      - name: i18n keys match
        run: |
          python - <<'PY'
          import json
          en, de = (set(json.load(open(f"i18n/{l}.json"))) for l in ("en", "de"))
          missing = sorted(en ^ de)
          if missing:
              raise SystemExit(f"i18n key mismatch: {missing}")
          print(f"{len(en)} keys, EN == DE")
          PY
